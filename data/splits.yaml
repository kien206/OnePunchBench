# Family -> split assignment (consumed by onepunch.data.splits / scripts/assign_splits.py).
# Family = root of the Base Model chain, lowercased, unless merged by `family_aliases`.
# Patterns are fnmatch globs on the lowercase family name. The monitor / calib / testA
# lists are PROVISIONAL: the E0 census (registry counts per family) finalizes them.

cutoff_date: "2025-03-13"        # families first released after this -> testB (leaderboard retired)

# family_aliases: pattern -> canonical family (e.g. all Llama 3.x lineages are one pretraining family)
family_aliases:
  "meta-llama/llama-3*": llama3
  "meta-llama/meta-llama-3*": llama3
  "nousresearch/meta-llama-3*": llama3
  "google/gemma-2-*": gemma2
  # same-recipe size series that appear only in held-out splits
  "eleutherai/pythia-*": pythia
  "eleutherai/gpt-neo-*": gpt-neo
  "bigscience/bloom*": bloom
  "tinyllama/*": tinyllama
  "huggingfacetb/smollm-*": smollm
  "stabilityai/stablelm-2-*": stablelm2
  "internlm/*": internlm
  # one pretraining lineage each (the per-size / per-version roots fragmented them, and a Phi-3
  # 4-bit fine-tune had landed in train while other Phi-3 models were monitor)
  "microsoft/phi-3*": phi3
  "unsloth/phi-3*": phi3
  "ibm-granite/granite-3.0-2b*": granite3
  "ibm-granite/granite-3.1-2b*": granite3

# held-out architectures: whole family -> testC if the majority of its members match
testC:
  archs: ["*Mamba*", "*Jamba*", "*Rwkv*", "*RWKV*", "*Recurrent*", "*Hymba*", "*Zamba*",
          "*Moe*", "*MoE*", "Mixtral*", "Olmoe*", "Dbrx*", "*Lfm2*", "*NemotronH*"]
  use_moe_flag: true

# models that cannot be scored with the causal-LM logprob backend
excluded_archs: ["T5*", "MT5*", "UMT5*", "SwitchTransformers*", "*SequenceClassification",
                 "*RewardModel*", "*CausalRM", "LLMForSequenceRegression", "Qwen2Model", "GemmaModel"]

# (patterns match the family AFTER aliasing)
# monitor: 3 families / 3 tokenizers in tier_s (data/models/monitor_round1.yaml, 2026-10-17)
monitor: ["deepseek-ai/deepseek-r1-distill-qwen-*", "phi3", "granite3", "mistralai/mistral-nemo-base-2407"]
calib: ["microsoft/phi-2", "stablelm2", "google/gemma-2b"]   # stablelm2 / phi-2: tokenizers no train family uses
testA: ["tiiuae/falcon3-*", "smollm", "allenai/olmo-*", "lgai-exaone/*", "internlm", "pints-ai/*",
        "tinyllama", "bloom", "pythia", "gpt-neo", "facebook/opt-*", "microsoft/phi-1_5"]

# every other family is "train" if it has at least this many non-gated-out hub models (on_hub != False)
train_min_models: 3

# surrogate groups: group name -> reference models; the tokenizer hash of the first reference
# found in the registry (with a hash) defines the group; train models with that hash get the name.
surrogates:
  qwen2: ["Qwen/Qwen2.5-0.5B", "Qwen/Qwen2.5-0.5B-Instruct"]
  llama3: ["meta-llama/Llama-3.2-1B", "meditsolutions/Llama-3.2-SUN-1B-chat", "NousResearch/Meta-Llama-3-8B"]

# per-model manual overrides (win over everything)
overrides: {}
