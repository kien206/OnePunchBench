[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onepunch"
version = "0.1.0"
description = "OnePunchBench: one prompt to predict LLM benchmark scores"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.57",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "tiktoken",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "datasets",
    "huggingface_hub",
    "python-dotenv",
]

[project.optional-dependencies]
lmeval = ["lm_eval[ifeval,math]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads real HF models or tokenizers (needs network/cache); deselect with -m 'not slow'",
    "gpu: needs a CUDA device",
]
